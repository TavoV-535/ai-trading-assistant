# ============================================================
# AI Trading Assistant — default configuration
# Environment variables (see .env.example) always override
# values here. Never put secrets in this file.
# ============================================================

app:
  name: "AI Trading Assistant"
  env: development
  timezone: "America/New_York"

logging:
  level: INFO
  json: false
  log_dir: "logs"
  max_bytes: 10485760 # 10 MB
  backup_count: 5

event_bus:
  # max events buffered per subscriber queue before backpressure
  queue_max_size: 1000
  # how long a handler may run before it's logged as slow (seconds)
  slow_handler_threshold: 2.0

plugins:
  # directories scanned for plugins, relative to project root
  search_paths:
    - "plugins/indicators"
    - "plugins/strategies"
    - "plugins/scanners"
    # One unified External Intelligence Platform folder (Milestone 7) --
    # News, Earnings, Macro, and any future source (SEC filings, insider
    # activity, economic calendar, ...) are all plugins under here, not
    # separate isolated search paths. See app/intelligence/plugin.py.
    - "plugins/intelligence"
    - "plugins/ai"
    - "plugins/broker"
    - "plugins/journals"
    - "plugins/alerts"
    - "plugins/dashboards"
    - "plugins/education"
    - "plugins/commands"
    - "plugins/integrations"
    - "plugins/risk"
    - "plugins/market_data"
  # plugins listed here are skipped even if discovered
  disabled: []

reasoning:
  enabled: true
  provider: anthropic
  model: "claude-opus-4-8"
  max_tokens: 1500
  temperature: 0.3
  min_evidence_count: 1

database:
  pool_size: 5
  max_overflow: 10
  echo: false

scanner:
  interval_seconds: 60
  timeframes: ["1m", "5m", "15m", "1h", "1d"]
  asset_classes: ["stocks", "crypto"]

api:
  host: "0.0.0.0"
  port: 8000

discord:
  command_prefix: "/"
  # Channel ID the bot proactively posts AlertGenerated events to. Leave
  # null to keep alerts decision-only (evaluated + logged, never posted) --
  # useful during development, or before you've picked an alerts channel.
  alert_channel_id: null

aggregation:
  # how long (seconds) a piece of evidence stays "fresh" / active before it
  # decays out of the Strategy Engine's and Reasoning Engine's view
  freshness_window_seconds: 900
  # bounded per-symbol history the aggregator retains (full sequence, not
  # just the fresh subset)
  max_history_per_symbol: 500

market_data:
  # Provider names to try, in priority order -- see app/marketdata/service.py.
  # A symbol/timeframe the first provider doesn't have falls over to the
  # next one instead of failing the whole fetch.
  providers: ["replay"]

intelligence:
  # Default poll interval for every External Intelligence Platform plugin
  # that doesn't set its own interval_seconds in its config.yaml.
  interval_seconds: 60

context:
  # Thresholds the Market Context Engine (app/context/engine.py) uses to
  # derive Bull/Bear/Sideways trend, High/Low Volatility, Gap Day, Trend
  # Exhaustion, Low Liquidity, and market-wide Risk-On/Risk-Off from raw
  # price/volume history -- tune per asset class without touching code.
  trend_window: 20
  trend_bull_threshold_pct: 1.5
  trend_bear_threshold_pct: -1.5
  volatility_window: 20
  high_volatility_threshold_pct: 2.0
  low_volatility_threshold_pct: 0.3
  gap_threshold_pct: 2.0
  low_liquidity_volume_ratio: 0.4
  risk_regime_min_symbols: 2
  risk_regime_majority_ratio: 0.6

confidence_weighting:
  # Per-source reliability multiplier used by the Confidence Weighting
  # Framework (app/aggregation/weighting.py). Any source not listed here
  # falls back to DEFAULT_SOURCE_RELIABILITY (0.75). This also doubles as
  # a stand-in for "historical reliability" until a real trade-outcome
  # history exists to derive it empirically instead of by config.
  source_reliability:
    EMA: 0.75
    SMA: 0.7
    VWAP: 0.75
    RSI: 0.75
    MACD: 0.75
    ATR: 0.65
    ADX: 0.7
    Bollinger: 0.7
    Supertrend: 0.75
    OBV: 0.65
    CCI: 0.65
    Ichimoku: 0.7
    Donchian: 0.7
    VolumeProfile: 0.65
    News: 0.55
    Earnings: 0.8
    Macro: 0.85
  max_cross_confirmation_boost: 0.5
  max_timeframe_alignment_boost: 0.2
  contradiction_penalty: 0.5
  regime_aligned_boost: 1.2
  regime_opposed_penalty: 0.85

portfolio:
  # The configured set of symbols the Portfolio Intelligence Layer
  # continuously monitors/profiles (app/portfolio/). A symbol outside this
  # list is never tracked -- "watch a new symbol" is a config change here,
  # not a code change. Matches the reference scanner's default watchlist
  # so /watchlist has real data out of the box.
  watchlist: ["NVDA", "AAPL", "TSLA"]
  confidence_trend_window: 8
  confidence_trend_margin: 0.05
  notable_context_types: ["trend", "volatility", "gap", "exhaustion", "risk_regime", "macro_event"]
  fundamental_freshness_seconds: 600
  alert_suppression_seconds: 300
  alert_suppression_factor: 0.5

prioritization:
  # A candidate (fresh evidence, a strategy match, a context shift) must
  # score at least this high (0-100) to become a real Discord alert.
  alert_threshold: 60.0
  # Minimum time between two alerts sharing the same (symbol, alert_key) --
  # the duplicate-suppression window that keeps the same development from
  # re-alerting every time its underlying evidence re-fires.
  alert_cooldown_seconds: 300
  # Only watchlist symbols (portfolio.watchlist) are eligible for alerts.
  watchlist_only: true
  decision_log_size: 20

simulation:
  # The Unified Simulation Engine (app/simulation/) -- the common execution
  # environment for Historical Backtesting, Replay Mode, Strategy
  # Comparison, Parameter Optimization, and future AI Training. Publishes
  # the exact same events live operation does, through the exact same
  # engines, over an isolated event bus scoped to one run.
  default_bar_count: 200
  default_timeframe: "1m"
  # Simulated wall-clock time advanced per bar -- independent of how fast
  # the bar is actually processed on this machine, which is what makes
  # freshness/decay/cooldown math reproducible run to run.
  bar_interval_seconds: 60
  # "instant" (no delay -- backtesting/optimization speed) or "realtime"
  # (sleeps bar_interval_seconds between bars -- a human-watchable Replay
  # Mode speed). Both publish identical events through identical engines.
  pace: "instant"
  # How often (in bars) the Decision Timeline records a decision per symbol.
  decision_interval_bars: 5
  # How many further bars must elapse before a recorded decision's outcome
  # (did subsequent price action agree with its direction) is resolved.
  lookahead_bars: 10
  # Price moves smaller than this (percent) resolve to "neutral" rather
  # than "correct"/"incorrect" -- avoids over-crediting noise-level moves.
  outcome_neutral_band_pct: 0.05
  # Whether the Simulation Engine also drives News/Earnings/Macro evidence
  # (by calling each plugin's deterministic poll_once() directly) alongside
  # technical evidence.
  include_intelligence: true
  intelligence_poll_interval_bars: 5
  # Bounded per-symbol in-memory history kept by DecisionTimeline -- the
  # durable, unbounded record always remains queryable from event_log.
  timeline_max_per_symbol: 500
  # Reproducibility comes from the configured market data provider's own
  # deterministic seed (plugins/market_data/replay/config.yaml) -- the
  # Simulation Engine deliberately introduces no second seeding mechanism,
  # it just uses market_data.providers the same way live operation does.

reflection:
  # The Reflection Engine (app/reflection/) -- generates a structured
  # post-decision analysis automatically the moment a DecisionRecorded's
  # outcome resolves. false degrades gracefully (no reflections, no error),
  # the same pattern reasoning.enabled already establishes.
  enabled: true
  # Bounded per-symbol in-memory history -- the durable, unbounded record
  # always remains queryable from event_log via EventLogRepository.reflections().
  history_max_per_symbol: 200

journal:
  # The Trading Journal (app/journal/) -- enriches Decision Timeline
  # records with reflections, user notes, and screenshot placeholders
  # rather than duplicating their content.
  max_entries_per_symbol: 500
  # Bounded notes retained per entry in memory -- the durable record in
  # event_log is never trimmed.
  max_notes_per_entry: 50

capital_protection:
  # The Capital Protection Engine (app/capital_protection/, Milestone 11)
  # -- continuously monitors capital preservation and publishes structured
  # RiskEvents; it never blocks a trade or command directly. false
  # degrades gracefully (no risk evaluation, no error), the same pattern
  # reflection.enabled already establishes.
  enabled: true
  # The synthetic notional capital baseline every drawdown/position-sizing
  # calculation is computed against -- no real broker balance exists yet.
  starting_equity: 100000.0
  # Which of the profiles below is currently active. Switching this (or
  # calling RiskProfileRegistry.set_active()/the /risk command's `profile`
  # parameter at runtime) changes every threshold the engine evaluates
  # against -- a config change or a live command, never a code change.
  active_profile: swing_trader
  correlation_window_bars: 60
  correlation_min_samples: 10
  trailing_drawdown_window_trades: 20
  concentration_window_trades: 20
  evaluation_interval_ticks: 20
  # symbol -> sector, for the sector_concentration risk type. A symbol
  # with no entry here is grouped under "Unknown" -- always computable.
  symbol_sectors:
    NVDA: Technology
    AAPL: Technology
    TSLA: Consumer Discretionary
  # The Adaptive Risk Profile system (PROJECT.md's Milestone 11 spec):
  # five built-in profiles below, each a plain, addressable config entry
  # -- adding a sixth ("Custom Profile") means adding another entry here,
  # or calling RiskProfileRegistry.register() at runtime, never editing
  # the Capital Protection Engine itself.
  profiles:
    conservative:
      name: conservative
      max_daily_loss_pct: 1.5
      max_total_drawdown_pct: 5.0
      max_position_size_pct: 2.0
      max_concurrent_positions: 3
      max_portfolio_exposure_pct: 10.0
      correlation_limit: 0.5
      sector_limit_pct: 15.0
      symbol_limit_pct: 5.0
      max_consecutive_losses: 3
      max_leverage: null
    swing_trader:
      name: swing_trader
      max_daily_loss_pct: 3.0
      max_total_drawdown_pct: 10.0
      max_position_size_pct: 5.0
      max_concurrent_positions: 5
      max_portfolio_exposure_pct: 20.0
      correlation_limit: 0.7
      sector_limit_pct: 30.0
      symbol_limit_pct: 10.0
      max_consecutive_losses: 5
      max_leverage: null
    day_trader:
      name: day_trader
      max_daily_loss_pct: 4.0
      max_total_drawdown_pct: 12.0
      max_position_size_pct: 7.0
      max_concurrent_positions: 6
      max_portfolio_exposure_pct: 30.0
      correlation_limit: 0.75
      sector_limit_pct: 35.0
      symbol_limit_pct: 12.0
      max_consecutive_losses: 6
      max_leverage: null
    scalper:
      name: scalper
      max_daily_loss_pct: 2.5
      max_total_drawdown_pct: 8.0
      max_position_size_pct: 3.0
      max_concurrent_positions: 10
      max_portfolio_exposure_pct: 25.0
      correlation_limit: 0.6
      sector_limit_pct: 25.0
      symbol_limit_pct: 8.0
      max_consecutive_losses: 8
      max_leverage: null
    prop_firm:
      # Mirrors real prop-firm evaluation rules (e.g. a 5% max daily loss
      # / 10% max total loss style challenge) -- what prop_firm_compliance
      # (RiskEvent.risk_type) evaluates against.
      name: prop_firm
      max_daily_loss_pct: 5.0
      max_total_drawdown_pct: 10.0
      max_position_size_pct: 5.0
      max_concurrent_positions: 3
      max_portfolio_exposure_pct: 15.0
      correlation_limit: 0.5
      sector_limit_pct: 20.0
      symbol_limit_pct: 8.0
      max_consecutive_losses: 4
      max_leverage: null

learning:
  # The Learning Engine (app/learning/, Milestone 12) -- continuously
  # analyzes historical Decision Timeline / Trading Journal / Reflection /
  # Capital Protection / Strategy Match / Market Context history to
  # identify recurring behavioral patterns and publish CoachingEvents. It
  # never alters historical data -- only observes, reasons, and publishes
  # new events. false degrades gracefully (no coaching events, no error),
  # the same pattern reflection.enabled/capital_protection.enabled
  # establish.
  enabled: true
  # How many newly-resolved decisions accumulate before the engine
  # re-runs its full pattern review.
  review_interval_decisions: 5
  min_sample_size: 5
  calibration_min_sample: 3
  calibration_tolerance: 0.10
  strategy_analytics_max_per_strategy: 1000
  history_max_decisions: 2000
  history_max_journal_notes: 500
  history_max_risk_events: 2000
  streak_length: 2
  overtrading_decisions_per_day: 10.0
  undertrading_decisions_per_day: 0.5
  # Simple keyword heuristics for the "emotional trend" pattern --
  # deliberately not real sentiment analysis/NLP.
  positive_journal_keywords: [confident, disciplined, calm, patient, focused]
  negative_journal_keywords: [frustrated, anxious, fomo, revenge, impulsive, angry, panicked]
  # UTC hour ranges mapped to a labeled trading session -- a documented
  # approximation given no real exchange calendar integration exists yet.
  session_hour_ranges:
    Asia: [0, 8]
    London: [8, 13]
    US Regular Session: [13, 20]
    After-Hours: [20, 24]

memory_index:
  # The Memory Index (app/memory/, Milestone 12) -- lets future AI
  # providers retrieve only relevant historical information instead of
  # scanning the full database. Provider-agnostic, local-first; supports
  # semantic retrieval later without changing the rest of the
  # architecture (see app/memory/index.py).
  enabled: true
  max_entries: 5000
